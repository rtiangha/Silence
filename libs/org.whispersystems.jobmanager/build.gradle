apply plugin: 'com.android.library'

version = "1.0.2"
group   = "org.whispersystems"

android {
    namespace "org.whispersystems.jobmanager"
    compileSdkVersion 33

    defaultConfig {
        minSdkVersion 19
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

