plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'signing'
    id 'org.jetbrains.dokka'
}

android {
    compileSdkVersion 33

    defaultConfig {
        minSdkVersion 21 
        targetSdkVersion 33
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            resources.srcDirs = ['src']
            res.srcDirs = ['res']
            java.srcDirs = ['src']
        }
    }

    namespace 'org.whispersystems.libpastelog'
}

version = version_number
group = group_info
archivesBaseName = "libpastelog"

dependencies {
    implementation 'androidx.legacy:legacy-support-v4:1.0.0' 
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
}

repositories {
    google()
    mavenCentral()
    mavenLocal()
    gradlePluginPortal()
}

task androidJavadocJar(type: Jar, dependsOn: dokkaJavadoc) {
    archiveClassifier.set('javadoc')
    from dokkaJavadoc.outputDirectory
}

task androidSourcesJar(type: Jar) {
    archiveClassifier.set('sources')
    from android.sourceSets.main.java.srcDirs
}

// Local installation task
task installArchives(type: Copy) {
    dependsOn assemble
    from("$buildDir/outputs/aar/${project.name}-release.aar")
    into("${System.getProperty('user.home')}/.m2/repository/${project.group.replace('.', '/')}/${archivesBaseName}/${version}")
}

tasks.whenTaskAdded { task ->
    if (task.name.equals("lint")) {
        task.enabled = false
    }
}
