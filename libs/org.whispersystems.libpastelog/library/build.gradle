plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'signing'
}

android {
    compileSdkVersion 33

    defaultConfig {
        minSdkVersion 21 
        targetSdkVersion 33
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            resources.srcDirs = ['src']
            res.srcDirs = ['res']
            java.srcDirs = ['src']
        }
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

version = version_number
group = group_info
archivesBaseName = "libpastelog"

dependencies {
    implementation 'androidx.legacy:legacy-support-v4:1.0.0' 
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
}

repositories {
    google()
    mavenCentral()
    mavenLocal()
    gradlePluginPortal()
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = group
            artifactId = archivesBaseName
            version = version

            afterEvaluate {
                artifact bundleReleaseAar
                artifact androidSourcesJar
                artifact androidJavadocJar
            }

            pom {
                name = 'libpastelog'
                packaging = 'aar'
                description = 'Easily allow users to post debug logs online'
                url = 'https://github.com/signalapp/libpastelog'

                scm {
                    url = 'scm:git@github.com:signalapp/libpastelog.git'
                    connection = 'scm:git@github.com:signalapp/libpastelog.git'
                    developerConnection = 'scm:git@github.com:signalapp/libpastelog.git'
                }

                licenses {
                    license {
                        name = 'GPLv3'
                        url = 'https://www.gnu.org/licenses/gpl-3.0.txt'
                        distribution = 'repo'
                    }
                }

                developers {
                    developer {
                        name = 'Moxie Marlinspike'
                    }
                }
            }
        }
    }

    repositories {
        maven {
            url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
            credentials {
                username = findProperty('whisperSonatypeUsername') ?: ""
                password = findProperty('whisperSonatypePassword') ?: ""
            }
        }
    }
}

signing {
    sign publishing.publications.release
}

task androidJavadocJar(type: Jar, dependsOn: dokkaJavadoc) {
    archiveClassifier.set('javadoc')
    from dokkaJavadoc.outputDirectory
}

task androidSourcesJar(type: Jar) {
    archiveClassifier.set('sources')
    from android.sourceSets.main.java.srcDirs
}

// Local installation task
task installArchives(type: Copy) {
    dependsOn assemble
    from("$buildDir/outputs/aar/${project.name}-release.aar")
    into("${System.getProperty('user.home')}/.m2/repository/${project.group.replace('.', '/')}/${archivesBaseName}/${version}")
}

tasks.whenTaskAdded { task ->
    if (task.name.equals("lint")) {
        task.enabled = false
    }
}
