plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'signing'
}

android {
    compileSdkVersion 33

    // Modern source set configuration
    sourceSets {
        androidTest.java.srcDirs += ['src/androidTest/java', project(':tests').file('src/test/java')]
    }

    // Default config for library variants
    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

group = group_info
version = version_number
archivesBaseName = "signal-protocol-android"

repositories {
    google()
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation "org.whispersystems:curve25519-android:${curve25519_version}"
    implementation(project(':java')) {
        exclude group: 'org.whispersystems', module: 'curve25519-java'
    }
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = group
            artifactId = archivesBaseName
            version = version

            afterEvaluate {
                artifact bundleReleaseAar
                artifact androidSourcesJar
                artifact androidJavadocJar
            }

            pom {
                name = 'signal-protocol-android'
                packaging = 'aar'
                description = 'Signal Protocol cryptography library for Android'
                url = 'https://github.com/WhisperSystems/libsignal-android'

                scm {
                    url = 'scm:git@github.com:WhisperSystems/libsignal-android.git'
                    connection = 'scm:git@github.com:WhisperSystems/libsignal-android.git'
                    developerConnection = 'scm:git@github.com:WhisperSystems/libsignal-android.git'
                }

                licenses {
                    license {
                        name = 'GPLv3'
                        url = 'https://www.gnu.org/licenses/gpl-3.0.txt'
                        distribution = 'repo'
                    }
                }

                developers {
                    developer {
                        name = 'Moxie Marlinspike'
                    }
                }
            }
        }
    }

    repositories {
        maven {
            url = findProperty('sonatypeRepo') ?: ''
            credentials {
                username = findProperty('whisperSonatypeUsername') ?: ''
                password = findProperty('whisperSonatypePassword') ?: ''
            }
        }
    }
}

signing {
    sign publishing.publications.release
}

// Javadoc task configuration
task androidJavadocJar(type: Jar, dependsOn: dokkaJavadoc) {
    archiveClassifier.set('javadoc')
    from dokkaJavadoc.outputDirectory
}

// Local installation task
task installArchives(type: Copy) {
    dependsOn publishToMavenLocal
    from("$buildDir/outputs/aar/${project.name}-release.aar")
    into("${System.getProperty('user.home')}/.m2/repository/${project.group.replace('.', '/')/${archivesBaseName}/${version}")
}