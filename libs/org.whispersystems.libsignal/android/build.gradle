plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'signing'
}

android {
    compileSdkVersion 33

    // Modern source set configuration
    sourceSets {
        androidTest.java.srcDirs += ['src/androidTest/java', project(':tests').file('src/test/java')]
    }

    // Default config for library variants
    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

group = group_info
version = version_number
archivesBaseName = "signal-protocol-android"

repositories {
    google()
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation "org.whispersystems:curve25519-android:${curve25519_version}"
    implementation(project(':java')) {
        exclude group: 'org.whispersystems', module: 'curve25519-java'
    }
}

// Local installation task
task installArchives(type: Copy) {
    dependsOn publishToMavenLocal
    from("$buildDir/outputs/aar/${project.name}-release.aar")
    into("${System.getProperty('user.home')}/.m2/repository/${project.group.replace('.', '/')}/${archivesBaseName}/${version}")
}
