apply plugin: 'java'

ext.version_number     = "2.7.1"
ext.group_info         = "org.whispersystems"
ext.curve25519_version = "0.5.0"

sourceCompatibility = 1.17
targetCompatibility = 1.17
archivesBaseName = "signal-protocol-java"
version          = version_number
group            = group_info



sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'build/generated/source/protobuf/main/java']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java/', project(':tests').file('src/test/java')]
        }
    }
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.1'
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option 'lite'
                }
            }
        }
    }
}

dependencies {
    implementation "org.whispersystems:curve25519-java:${curve25519_version}"
    implementation 'com.google.protobuf:protobuf-java:3.25.1'

    

    testImplementation ('junit:junit:4.13.2')
}


test {
    testLogging {
        events 'passed'
        showStandardStreams = true
    }

    include 'org/whispersystems/**'
}

