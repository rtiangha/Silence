        google()
        mavenCentral()
        gradlePluginPortal()
        maven {
            url "https://artifactory.appodeal.com/appodeal-public/"
        }
        maven { url 'https://jitpack.io' }
        mavenLocal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven {
            url "https://artifactory.appodeal.com/appodeal-public/"
        }
        maven { url 'https://jitpack.io' }
        mavenLocal()
    }
}

